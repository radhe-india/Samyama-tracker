function simFill(){
  const sd=V.sd,tk=todayK(),start=sd.range==='all'?addD(DAY1,-14):addD(tk,-(+sd.range)+1);
  const total=Math.max(1,diff(start,tk)+1),r=Math.random,ch=(p)=>r()<p,rnd=(a,b)=>Math.round(a+r()*(b-a));
  let k=start,i=0,made=0;S.logs[SANDBOX()]=S.logs[SANDBOX()]||{};
  while(k<=tk){
    const prog=i/Math.max(1,total-1);
    let q={steady:.85,improving:.3+.65*prog,mixed:.35+.55*r(),struggling:.38}[sd.pattern];
    q=Math.max(.05,Math.min(.98,q+(r()-.5)*.12));
    if(sd.gaps&&ch(.12)&&k!==tk){delete S.logs[SANDBOX()][k]}
    else{
      const l=norm({});
      l.bhuta=ch(q);l.sk=ch(q)?rnd(2,4):0;l.ss=ch(q)?rnd(10,18):0;l.asCyc=ch(q*.9)?rnd(6,16):0;l.asSec=[30,45,60,90][rnd(0,3)];
      l.sck=ch(q)?(ch(q)?2:1):(ch(.5)?1:0);l.shoonya=ch(q)?(ch(q*.95)?2:1):0;l.shambhavi=ch(q)?(ch(q)?2:1):0;
      l.sits=ch(q)?(ch(q)?[rnd(55,75)]:[rnd(25,45),rnd(10,25)]):(ch(.5)?[rnd(10,30)]:[]);
      l.aum=ch(q*.8)?rnd(5,25):0;l.ardha=Math.max(0,Math.round(15+prog*55*(.6+q*.4)+rnd(-6,6)));
      l.patanga=ch(q);l.shishu=ch(q*.9);
      l.dNeg=ch(q+.1);l.dStim=ch(q+.15);l.dDairy=ch(q);l.dOut=ch(q+.05);
      l.fruit=Math.round((q*35+rnd(-5,10))/5)*5;l.salad=Math.round((q*25+rnd(-5,10))/5)*5;l.fruit=Math.max(0,l.fruit);l.salad=Math.max(0,l.salad);
      l.sprouts=ch(q);l.peanuts=ch(q*.8);l.sanj=ch(q*.7);
      l.digital=Math.max(15,Math.round(220-150*q+rnd(-20,30)));l.silence=Math.round(q*4*2)/2;
      if(ch(.15))l.note=['Steady sitting today.','Mind was restless in Shoonya.','Long Sukha Kriya at sunset.','Felt light after the kanji.'][rnd(0,3)];
      S.logs[SANDBOX()][k]=l;made++;
    }
    k=addD(k,1);i++;
  }
  save();return made;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='ob'){if(V.ob==='name'&&b.dataset.v==='batch'){const m=$('#obmsg');if(!V.obName.trim()){const i=$('#obname');if(i)i.focus();if(m)m.textContent='Please enter your name.';return}
    if(CLOUD){if(!/^\S+@\S+\.\S+$/.test(V.obEmail.trim())){m.textContent='Please enter a valid email.';return}if(V.obPw1.length<6){m.textContent='Use at least 6 characters for the password.';return}if(V.obPw1!==V.obPw2){m.textContent='The two passwords do not match.';return}}
    else if(V.obPw1||V.obPw2){if(V.obPw1.length<4){m.textContent='Use at least 4 characters for the password.';return}if(V.obPw1!==V.obPw2){m.textContent='The two passwords do not match.';return}}}V.ob=b.dataset.v;render();scrollTo(0,0);return}
  if(a==='obcolor'){V.obColor=b.dataset.v;render();return}
  if(a==='obbatch'){V.obBatch=b.dataset.v;render();return}
  if(a==='batch'){S.people[ME].batch=b.dataset.v;save();V.sim=null;render();return}
  if(a==='simplay'){if(V.playing){V.playing=false;clearInterval(simTimer);simTimer=null}else{const st=addD(DAY1,-14);if(!V.sim||V.sim>=SAMYAMA)V.sim=st;V.playing=true;simTimer=setInterval(simTick,140)}render();return}
  if(a==='simreset'){V.playing=false;clearInterval(simTimer);simTimer=null;V.sim=null;render();return}
  if(a==='simbrowse'){if(!V.sim)V.sim=todayK();V.playing=false;clearInterval(simTimer);simTimer=null;V.tab='today';V.sub=null;render();scrollTo(0,0);return}
  if(a==='simstep'){V.sim=addD(V.sim,+b.dataset.d);if(V.sim<addD(DAY1,-14))V.sim=addD(DAY1,-14);if(V.sim>SAMYAMA)V.sim=SAMYAMA;render();return}
  if(a==='obpick'&&S.people[b.dataset.k].pwHash){V.pickId=b.dataset.k;V.ob='pw';render();return}
  if(a==='obpick'){ME=b.dataset.k;ls.set(STORE+'-me',ME);V.ob=null;V.tab='today';V.day=todayK();render();scrollTo(0,0);return}
  if(a==='obdone'&&CLOUD){cloudSignUp(b);return}
  if(a==='obdone'){(async()=>{
    const id='p'+Date.now().toString(36),P=defPerson(V.obName.trim()||'Practitioner',V.obColor);
    if(V.obPw1)P.pwHash=await hashPw(id+':'+V.obPw1);V.obPw1=V.obPw2='';
    P.batch=V.obBatch;P.routines.weekday.wake=P.routines.weekend.wake=V.obWake;P.routines.weekday.sleep=P.routines.weekend.sleep=V.obSleep;
    S.people[id]=P;S.order.push(id);S.logs[id]={};save();ME=id;ls.set(STORE+'-me',ME);V.ob=null;V.tab='today';render();scrollTo(0,0)})();return}
  if(a==='tab'){V.tab=b.dataset.t;V.sub=null;V.et=null;V.confirmReset=false;render();scrollTo(0,0);return}
  if(a==='gosub'){V.tab='profile';V.sub=b.dataset.s;render();scrollTo(0,0);return}
  if(a==='back'){V.sub=V.sub==='member'?'sangha':null;V.sel=null;render();scrollTo(0,0);return}
  if(a==='member'){V.mid=b.dataset.k;V.sub='member';V.sel=null;render();scrollTo(0,0);return}
  if(a==='adminlogin'){(async()=>{const u=(($('#aun')||{}).value||'').trim().toLowerCase(),p1=($('#apw1')||{}).value||'',m=$('#apwmsg');
    if(u!=='admin'||!ADMIN_H.includes(await hashPw(p1))){m.textContent='Username or password is not right.';return}
    ensureAdmin();ME='admin';ls.set(STORE+'-me','admin');ls.set(STORE+'-adminok','1');ADMIN_TODAY=S.adminToday||null;V.ob=null;V.tab='profile';V.sub='simdata';V.day=todayK();render();scrollTo(0,0)})();return}
  if(a==='userlogin'){(async()=>{const id=V.pickId,m=$('#upwmsg'),pw=($('#upw')||{}).value||'';
    if(await hashPw(id+':'+pw)!==S.people[id].pwHash){m.textContent='That password is not right. Try again.';return}
    ME=id;ls.set(STORE+'-me',ME);V.ob=null;V.tab='today';V.day=todayK();render();scrollTo(0,0)})();return}
  if(a==='mypwset'){(async()=>{const P=S.people[ME],m=$('#mpwmsg'),cur=($('#mpw0')||{}).value||'',p1=$('#mpw1').value,p2=$('#mpw2').value;
    if(P.pwHash&&await hashPw(ME+':'+cur)!==P.pwHash){m.textContent='Your current password is not right.';return}
    if(p1.length<4){m.textContent='Use at least 4 characters.';return}if(p1!==p2){m.textContent='The two new passwords do not match.';return}
    P.pwHash=await hashPw(ME+':'+p1);save();V.sub=null;render()})();return}
  if(a==='mypwdel'){(async()=>{const P=S.people[ME],m=$('#mpwmsg'),cur=($('#mpw0')||{}).value||'';
    if(await hashPw(ME+':'+cur)!==P.pwHash){m.textContent='Enter your current password to remove it.';return}
    delete P.pwHash;save();V.sub=null;render()})();return}
  if(a==='adminpwset'){(async()=>{const p1=$('#apw1').value,p2=$('#apw2').value,m=$('#apwmsg');if(p1.length<4){m.textContent='Use at least 4 characters.';return}if(p1!==p2){m.textContent='The two passwords do not match.';return}
    S.adminHash=await hashPw(p1);save();m.style.color='var(--teal)';m.textContent='Password saved.'})();return}
  if(a==='adate'){ADMIN_TODAY=b.dataset.k===keyOf(new Date())?null:b.dataset.k;S.adminToday=ADMIN_TODAY;save();V.day=todayK();V.sim=null;render();return}
  if(a==='sdset'){V.sd[b.dataset.k]=b.dataset.v;render();return}
  if(a==='sdgaps'){V.sd.gaps=!V.sd.gaps;render();return}
  if(a==='simfill'){const n=simFill();render();const m=$('#simmsg');if(m)m.textContent='Filled '+n+' day'+(n===1?'':'s')+'. Open Today or Progress to see them.';return}
  if(a==='backup'){doBackup(b.dataset.v);return}
  if(a==='simclear'){S.logs[SANDBOX()]={};save();render();return}
  if(a==='cloudsignin'){cloudSignIn();return}
  if(a==='forgot'){(async()=>{const e=(($('#siem')||{}).value||'').trim(),m=$('#simsg2');if(!/@/.test(e)){m.textContent='Type your email above first.';return}
    const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});m.style.color=error?'':'var(--teal)';m.textContent=error?'Could not send the email: '+error.message:'Check your email for a reset link. It can take a few minutes.'})();return}
  if(a==='setnewpw'){(async()=>{const p1=$('#npw1').value,p2=$('#npw2').value,m=$('#npwmsg');if(p1.length<6){m.textContent='Use at least 6 characters.';return}if(p1!==p2){m.textContent='The two passwords do not match.';return}
    const {error}=await sb.auth.updateUser({password:p1});if(error){m.textContent=error.message;return}V.ob=null;await afterSignIn()})();return}
  if(a==='cloudpw'){(async()=>{const p1=$('#cpw1').value,p2=$('#cpw2').value,m=$('#cpwmsg');if(p1.length<6){m.textContent='Use at least 6 characters.';return}if(p1!==p2){m.textContent='The two passwords do not match.';return}
    const {error}=await sb.auth.updateUser({password:p1});m.style.color=error?'':'var(--teal)';m.textContent=error?error.message:'Password changed.'})();return}
  if(a==='doimport'){const m=$('#impmsg');try{const n=importBackup($('#imptxt').value);m.style.color='var(--teal)';m.textContent='Imported '+n+' day'+(n===1?'':'s')+'. They will sync to your account.'}catch(err){m.style.color='';m.textContent='That text is not a backup from this app. Use "Copy a backup" in the test version and paste it here.'}return}
  if(a==='goday'){V.day=b.dataset.k;V.open=null;render();return}
  if(a==='sheet'){V.sheet=true;V.pickFor=b.dataset.for||'today';renderSheet();return}
  if(a==='sheetclose'){V.sheet=false;renderSheet();return}
  if(a==='pickday'){const k=b.dataset.k;V.sheet=false;
    if(V.pickFor==='list'&&logged(V.sub==='member'?V.mid:ME,k)){V.listOpen=k;V.pview='list';render();const el=document.getElementById('d-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
    V.day=k;V.open=null;V.tab='today';V.sub=null;render();scrollTo(0,0);return}
  if(a==='prange'){V.prange=b.dataset.v;render();return}
  if(a==='tip'){const c=b.closest('.chart');c.querySelector('.tipline').innerHTML=b.dataset.t;c.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));const m=c.querySelector('[data-b="'+b.dataset.i+'"]');if(m)m.classList.add('hl');return}
  if(a==='rmphoto'){delete S.people[ME].photo;save();render();return}
  if(a==='day'){const n=addD(V.day,+b.dataset.d);if(n<=todayK()){V.day=n;V.open=null}render();return}
  if(a==='today'){V.day=todayK();V.open=null;render();return}
  if(a==='open'){V.open=V.open===b.dataset.k?null:b.dataset.k;render();return}
  if(a==='jump'){const k=b.dataset.k;V.open=['sk','ss','as','sukha'].includes(k)?k:null;render();
    const el=document.getElementById('r-'+k);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('pop')}return}
  if(a==='goto'){V.day=b.dataset.k;V.tab='today';V.sub=null;render();scrollTo(0,0);return}
  if(a==='sel'){V.sel=V.sel===b.dataset.k?null:b.dataset.k;render();return}
  if(a==='pview'){V.pview=b.dataset.v;render();return}
  if(a==='kind'){V.kind=b.dataset.v;V.et=null;render();return}
  if(a==='et'){V.et=V.et===+b.dataset.i?null:+b.dataset.i;render();return}
  if(a==='etdone'){V.et=null;V.dirty=false;render();return}
  if(a==='theme'){THEME=b.dataset.v;ls.set(STORE+'-theme',THEME);applyTheme();render();return}
  if(a==='share'){S.people[ME].share=!S.people[ME].share;save();render();return}
  if(a==='color'){S.people[ME].color=b.dataset.v;save();render();return}
  if(a==='dinc'){const k=b.dataset.k.slice(4),R=S.people[ME].routines,D=S.people[ME].durs;D[k]=Math.max(5,Math.min(180,D[k]+ +b.dataset.d));save();
    ['weekday','weekend'].forEach(kd=>{if(R[kd].plan)buildPlan(ME,kd)});render();return}
  if(a==='dreset'){S.people[ME].durs={...DURS};save();rebuildPlans();render();return}
  if(a==='signout'&&CLOUD){cloudSignOut();return}
  if(a==='signout'){ls.del(STORE+'-me');ls.del(STORE+'-adminok');ADMIN_TODAY=null;ME=null;V.ob=S.order.length?'who':'welcome';V.tab='today';V.sub=null;render();scrollTo(0,0);return}
  if(['inc','cyc','tog','set','sadd','sdel','sho'].includes(a)){
    const l=mut(ME,V.day),k=b.dataset.k;
    if(a==='inc'){const v=Math.round(((getV(l,k)??0)+ +b.dataset.d)*10)/10;setV(l,k,Math.max(0,Math.min(+b.dataset.max,v)))}
    if(a==='cyc'){const m=+b.dataset.max;l[k]=(l[k]+1)%(m+1);if(l[k])V.just=k}
    if(a==='sho'){const i=+b.dataset.i;l.shoonya=l.shoonya>i?i:i+1;if(l.shoonya)V.just='shoonya'}
    if(a==='tog') l[k]=!l[k];
    if(a==='set') l[k]=+b.dataset.v;
    if(a==='sadd') l.sits.push(l.sits.length?20:60);
    if(a==='sdel') l.sits.splice(+b.dataset.i,1);
    save();render();return;
  }
  const r=ME&&S.people[ME].routines[V.kind];
  if(a==='addbusy'){r.busy.push({l:'',s:780,e:840});save();render();return}
  if(a==='delbusy'){r.busy.splice(+b.dataset.i,1);save();render();return}
  if(a==='build'){buildPlan(ME,V.kind);V.et=null;render();return}
  if(a==='copy'){const t=JSON.stringify(S),m=$('#copymsg');
    const fallback=()=>{if(m)m.textContent='Copy is blocked here. Select the text below.';b.insertAdjacentHTML('afterend',`<div style="padding:0 14px 14px"><textarea readonly>${esc(t)}</textarea></div>`)};
    try{navigator.clipboard.writeText(t).then(()=>{if(m)m.textContent='Copied. Paste it somewhere safe.'},fallback)}catch(err){fallback()}
    return}
  if(a==='reset'){V.confirmReset=true;render();return}
  if(a==='reset0'){V.confirmReset=false;render();return}
  if(a==='reset1'&&CLOUD){(async()=>{V.confirmReset=false;S.logs[ME]={};save();await pushNow();render()})();return}
  if(a==='reset1'){S=fresh();save();ls.del(STORE+'-me');ls.del(STORE+'-adminok');ADMIN_TODAY=null;ME=null;V.confirmReset=false;V.ob='welcome';V.tab='today';V.sub=null;render();return}
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;
  if(f==='rng'){const l=mut(ME,V.day),k=t.dataset.k,v=+t.value;setV(l,k,v);save();t.style.setProperty('--p',(v/+t.max*100)+'%');const o=document.getElementById(oid(k));if(o)o.textContent=showV(k,v);return}
  if(f==='sim'){const start=addD(DAY1,-14),total=+t.max,idx=+t.value;V.sim=addD(start,idx);applyJourney();t.style.setProperty('--p',(idx/total*100)+'%');const d=$('#simday'),c=$('#simcur');if(d)d.textContent=dayLabel(V.sim);if(c)c.style.left=(idx/total*100)+'%';return}
  if(f==='dsl'){setDur(t.dataset.k,+t.value,'s');t.style.setProperty('--p',(+t.value/180*100)+'%');const k=t.dataset.k,v=+t.value,h=$('#dh-'+k),m=$('#dm-'+k);if(h)h.value=Math.floor(v/60);if(m)m.value=v%60;return}
  if(f==='dh'||f==='dm'){const k=t.dataset.k,h=+($('#dh-'+k).value||0),m=+($('#dm-'+k).value||0);if(h*60+m>0)setDur(k,h*60+m,f==='dh'?'h':'m');return}
  if(f==='note'){mut(ME,V.day).note=t.value;save()}
  if(f==='name'){S.people[t.dataset.p].name=t.value||'—';save()}
  if(f==='obname'){V.obName=t.value}
  if(f==='obpw1'){V.obPw1=t.value}
  if(f==='obpw2'){V.obPw2=t.value}
  if(f==='obemail'){V.obEmail=t.value}
});
// time fields save on change but redraw only after the field is left, so the phone's picker never closes mid-selection
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f;if(!f||f==='note'||f==='obname'||f==='obpw1'||f==='obpw2'||f==='obemail')return;
  if(f==='name'){renderHeader();return}
  if(f==='rng'||f==='sim'){render();return}
  if(f==='adate'){if(!t.value)return;ADMIN_TODAY=t.value===keyOf(new Date())?null:t.value;S.adminToday=ADMIN_TODAY;save();V.day=todayK();render();return}
  if(f==='dsl'||f==='dh'||f==='dm'){rebuildPlans();return}
  if(f==='photo'){const file=t.files&&t.files[0];if(!file)return;const msg=$('#photomsg');if(msg)msg.textContent='Preparing photo…';loadPhoto(file,url=>{if(!url){if(msg)msg.textContent='That file could not be read as an image. Try a JPG or PNG.';return}S.people[ME].photo=url;save();render()});return}
  if(!t.value&&t.type==='time')return;
  if(f==='obwake'){V.obWake=fromHM(t.value);return}
  if(f==='obsleep'){V.obSleep=fromHM(t.value)||1439;return}
  const P=S.people[ME],r=P.routines[V.kind],i=+t.dataset.i;
  if(f==='wake') r.wake=fromHM(t.value);
  if(f==='sleep') r.sleep=fromHM(t.value)||1439;
  if(f==='bl') r.busy[i].l=t.value;
  if(f==='bs') r.busy[i].s=fromHM(t.value);
  if(f==='be') r.busy[i].e=fromHM(t.value);
  if(f==='pt'){r.plan[i].s=fromHM(t.value);save();return} // redrawn when Done is tapped
  save();V.dirty=true;
});
document.addEventListener('focusout',()=>{
  if(!V.dirty)return;
  setTimeout(()=>{const a=document.activeElement;if(a&&a.matches('input:not([type=range]),textarea'))return;V.dirty=false;render()},250);
});
let sw=null;
document.addEventListener('touchstart',e=>{const h=e.target.closest('.hero');sw=h?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
  if(Math.abs(dx)>50&&Math.abs(dy)<40){const n=addD(V.day,dx<0?1:-1);if(n<=todayK()){V.day=n;V.open=null;render()}}},{passive:true});
setInterval(()=>{const a=document.activeElement;if(!V.ob&&V.tab==='today'&&!(a&&a.matches('input,textarea')))render()},120000);
if(CLOUD_CFG&&!CLOUD){document.getElementById('main').innerHTML='<div class="ob" style="justify-content:center;text-align:center"><h2>Can’t connect right now</h2><p>The app needs the internet the first time it opens. Check your connection and try again.</p><button class="btn big" onclick="location.reload()">Try again</button></div>';document.getElementById('tabs').hidden=true}
else if(CLOUD){render();bootCloud()}else render();
