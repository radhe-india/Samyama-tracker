<title>Samyama Sadhana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,500;0,600;1,500&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Greeting header, a sky hero that tracks the sun over Bengaluru, illustrated practice rows, floating bottom bar.
   Warm cream ground, deep teal for action, terracotta robe tones in the illustrations, night-slate for summary cards. */
:root{
  --bg:#F4EEE2; --surface:#FFFDF8; --sand:#EDE3CE; --ink:#1F2A30; --muted:#716B5F; --line:#E5DBCA; --track:#E9E0CF;
  --teal:#2B7A7C; --teal-soft:#DCECE8; --on-teal:#FFFFFF; --terra:#B65A35; --terra-soft:#F4E0D3;
  --night:#1F2C34; --on-night:#F4EEE2; --night-muted:#A9B4B6; --warn:#B8432E; --shadow:rgba(60,45,20,.10);
  --ill-skin:#C98A60; --ill-hair:#2E2420; --ill-robe:#B5552F; --ill-robe2:#DB7A40; --ill-sun:#F1B444; --ill-glow:#F7CF73; --ill-line:#9B8C70; --ill-robe-d:#8C3E21; --ill-skin-l:#E0A77E;
  --f-mango:#EFA338; --f-leaf:#6E9A55; --f-banana:#F0CD55; --f-bowl:#C99E70; --f-green:#7FAE5E; --f-tomato:#D3533A; --f-nut:#C38E59; --f-cup:#93653F; --f-dev:#33414A;
  --t-peach:#F6DCC5; --t-sage:#DCE6D1; --t-dusk:#D9DEEC; --t-rose:#F2D7D1; --t-sand:#EEE3CB; --t-night:#24343E;
  --f-display:"Gelasio", Georgia, "Times New Roman", serif;
  --f-body:"Mukta", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13191C; --surface:#1B2327; --sand:#252D2F; --ink:#EFE8DA; --muted:#A29B8D; --line:#2C363A; --track:#2A3337;
  --teal:#62B5B0; --teal-soft:#1E3533; --on-teal:#0E1B1B; --terra:#E28B5F; --terra-soft:#3A2820;
  --night:#0D1316; --on-night:#EFE8DA; --night-muted:#8E9A9C; --warn:#E57B63; --shadow:rgba(0,0,0,.35);
  --ill-skin:#B97C55; --ill-hair:#1A1513; --ill-robe:#A44E2C; --ill-robe2:#C96B37; --ill-sun:#E8A93E; --ill-glow:#F2C46A; --ill-line:#857A63; --ill-robe-d:#73321A; --ill-skin-l:#CC9268;
  --f-bowl:#A9845D; --f-dev:#6B7B85;
  --t-peach:#3A2D23; --t-sage:#253027; --t-dusk:#242A37; --t-rose:#352628; --t-sand:#2C2922; --t-night:#0F181D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13191C; --surface:#1B2327; --sand:#252D2F; --ink:#EFE8DA; --muted:#A29B8D; --line:#2C363A; --track:#2A3337;
  --teal:#62B5B0; --teal-soft:#1E3533; --on-teal:#0E1B1B; --terra:#E28B5F; --terra-soft:#3A2820;
  --night:#0D1316; --on-night:#EFE8DA; --night-muted:#8E9A9C; --warn:#E57B63; --shadow:rgba(0,0,0,.35);
  --ill-skin:#B97C55; --ill-hair:#1A1513; --ill-robe:#A44E2C; --ill-robe2:#C96B37; --ill-sun:#E8A93E; --ill-glow:#F2C46A; --ill-line:#857A63; --ill-robe-d:#73321A; --ill-skin-l:#CC9268;
  --f-bowl:#A9845D; --f-dev:#6B7B85;
  --t-peach:#3A2D23; --t-sage:#253027; --t-dusk:#242A37; --t-rose:#352628; --t-sand:#2C2922; --t-night:#0F181D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* illustration classes */
.sk{fill:var(--ill-skin)} .hr{fill:var(--ill-hair)} .rb{fill:var(--ill-robe)} .rb2{fill:var(--ill-robe2)}
.skl{fill:none;stroke:var(--ill-skin);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.rbl{fill:none;stroke:var(--ill-robe);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.sun{fill:var(--ill-sun)} .glow{fill:var(--ill-glow)} .gl{fill:none;stroke:var(--ill-glow);stroke-width:2.2;stroke-linecap:round}
.ml{fill:none;stroke:var(--ill-line);stroke-width:1.6;stroke-linecap:round;opacity:.7}
.om{fill:var(--ill-glow);font-family:var(--f-body);font-weight:600}
.f-mango{fill:var(--f-mango)} .f-leaf{fill:var(--f-leaf)} .f-banana{fill:var(--f-banana)} .f-bowl{fill:var(--f-bowl)} .f-green{fill:var(--f-green)}
.f-tomato{fill:var(--f-tomato)} .f-nut{fill:var(--f-nut)} .f-cup{fill:var(--f-cup)} .f-dev{fill:var(--f-dev)} .f-screen{fill:var(--t-dusk)}
.t-peach{background:var(--t-peach)} .t-sage{background:var(--t-sage)} .t-dusk{background:var(--t-dusk)} .t-rose{background:var(--t-rose)} .t-sand{background:var(--t-sand)} .t-night{background:var(--t-night)}
.c-teal{background:var(--teal-soft);color:var(--teal)} .c-terra{background:var(--terra-soft);color:var(--terra)}
.c-sage{background:var(--t-sage);color:var(--f-leaf)} .c-dusk{background:var(--t-dusk);color:var(--ink)}

/* header */
.top{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.greet small{display:block;color:var(--muted);font-size:15px;line-height:1.1}
.greet b{font-family:var(--f-display);font-weight:500;font-size:27px;line-height:1.15;display:block}
.ptitle{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.1;display:flex;align-items:center;gap:10px;min-width:0}
.back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 6px var(--shadow);flex-shrink:0}
.back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0}
.av.ring2{box-shadow:0 0 0 2px var(--surface),0 0 0 4px currentColor}
.av.lg{width:76px;height:76px;font-size:30px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 120px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 6px 20px var(--shadow)}
.hero svg{display:block;width:100%;height:auto}
.hero .ov{position:absolute;left:16px;top:14px;right:96px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.hero .ov small{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.9}
.hero .ov b{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.15}
.hero.lt .ov{color:#FFFDF8;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.hero.dk .ov{color:#1F2A30}
.hero .navd{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.hero .navd button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,253,248,.85);color:#1F2A30;font-size:18px;line-height:1;display:grid;place-items:center}
.hero .navd button:disabled{opacity:.4}
.hero .navd .td{width:auto;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}

/* coach */
.coach{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 10px var(--shadow)}
.coach .tophead{display:flex;gap:14px;align-items:center}
.ring{flex-shrink:0;position:relative;width:62px;height:62px}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--track);stroke-width:6}
.ring .rp{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.coach h2{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.coach .hsub{color:var(--muted);font-size:14.5px;margin-top:2px}
.quote{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 4px}
.quote .qm{width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:0 2px 8px var(--shadow);display:grid;place-items:center}
.quote .qm svg{width:16px;height:16px;fill:var(--teal)}
.quote blockquote{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.45;text-wrap:balance}
.quote figcaption{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--terra);font-weight:600}
.scallop{display:block;width:100%;height:14px}
.scallop rect{fill:url(#scal)}
.todoh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.todoh b{font-weight:600;font-size:15px}
.todoh span{font-size:13px;color:var(--muted)}
.todos{display:flex;flex-wrap:wrap;gap:8px}
.todos{gap:6px}
.todo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;line-height:1.3;text-align:left}
.todo.must{border-color:color-mix(in srgb,var(--terra) 45%,var(--line))}
.todo.must::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terra);flex-shrink:0}
.todoh .key{display:inline-flex;align-items:center;gap:5px}
.todoh .key::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terra)}
.quote.sm{flex-direction:row;align-items:flex-start;gap:10px;text-align:left;padding:10px 0 0;border-top:1px solid var(--line)}
.quote.sm blockquote{font-size:15px;line-height:1.4;text-wrap:pretty}
.quote.sm figcaption{font-size:10.5px;margin-top:2px}
.quote.sm .qm{width:26px;height:26px;flex-shrink:0;box-shadow:none;background:var(--teal-soft)}
.quote.sm .qm svg{width:12px;height:12px}
.alldone{display:flex;align-items:center;gap:10px;color:var(--teal);font-weight:600}
.nextbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--teal);color:var(--teal);border-radius:14px;padding:11px 14px;font-weight:600;font-size:16px;background:none}
.nextbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.nextbtn b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:500}
.alert{font-size:14px;color:var(--warn);font-weight:500}
.cnote{font-size:14px;color:var(--muted)}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.sech h3{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0}
.sech span{font-size:13px;color:var(--muted)}

/* shoonya box */
.shoonya{border-radius:22px;padding:18px 18px 0;display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 10px;position:relative;overflow:hidden;box-shadow:0 2px 10px var(--shadow)}
.shoonya .eb{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--terra);font-weight:700}
.shoonya h3{font-family:var(--f-display);font-weight:500;font-size:28px;margin:2px 0 4px;line-height:1.1}
.shoonya p{margin:0;font-size:14px;color:var(--muted)}
.shoonya .ill{width:120px;height:120px;grid-row:1;grid-column:2;align-self:end}
.shoonya .rbtns{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0 18px;grid-column:1/-1}
.shoonya .rbtns .rbtn{flex:1;justify-content:center}
nav.tabs[hidden],header.top[hidden]{display:none}
.rbtn{border:1.6px solid var(--teal);background:var(--surface);color:var(--teal);border-radius:14px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.rbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rbtn.on{background:var(--teal);color:var(--on-teal)}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}

/* practice list */
.list{background:var(--surface);border-radius:20px;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
.prow + .prow{border-top:1px solid var(--line)}
.pmain{width:100%;border:0;background:none;display:grid;grid-template-columns:28px 56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;text-align:left}
.chk{width:26px;height:26px;border-radius:8px;border:1.7px solid var(--teal);display:grid;place-items:center;flex-shrink:0}
.chk svg{width:16px;height:16px;stroke:var(--teal);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chk.part{background:var(--teal-soft)}
.chk.part::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.done .chk{background:var(--teal)}
.done .chk svg{stroke:var(--on-teal)}
.thumb{width:56px;height:56px;border-radius:14px;display:block;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.done .thumb{opacity:.6}
.pname b{display:block;font-weight:500;font-size:17px;line-height:1.2}
.done .pname b{color:var(--muted)}
.pname small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.pname small.met{color:var(--teal);font-weight:600}
.pname small.over{color:var(--warn);font-weight:600}
.tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--terra);margin-left:6px;vertical-align:2px}
.pval{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pval .cv{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.open .pval .cv{transform:rotate(90deg)}
.pval .dots{display:flex;gap:4px}
.rd{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--teal);display:grid;place-items:center;background:var(--surface)}
.rd.on{background:var(--teal)}
.rd svg{width:13px;height:13px;stroke:var(--on-teal);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pbody{padding:2px 16px 16px;display:flex;flex-direction:column;gap:10px}
.prow.open{background:color-mix(in srgb,var(--teal-soft) 35%,var(--surface))}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctrl > span{font-size:14.5px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px;flex-shrink:0}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:21px;line-height:1}
.step output{min-width:58px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500}
.pill.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sit{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.x{border:0;background:none;color:var(--muted);font-size:24px;width:32px;height:42px;flex-shrink:0}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}

/* big sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:46px;margin:0;background:transparent;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:99px;background:linear-gradient(var(--teal),var(--teal)) 0 0/var(--p) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-10px;border-radius:50%;background:var(--surface);border:3px solid var(--teal);box-shadow:0 2px 6px var(--shadow)}
input[type=range]::-moz-range-track{height:14px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-progress{height:14px;border-radius:99px;background:var(--teal)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}

/* food */
.food{background:var(--surface);border-radius:20px;box-shadow:0 2px 10px var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.plate{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center}
.plate svg{width:112px;height:112px}
.plate .pt{fill:none;stroke:var(--track);stroke-width:14}
.plate .pf{fill:none;stroke:var(--f-mango);stroke-width:14}
.plate .ps{fill:none;stroke:var(--f-green);stroke-width:14}
.plate .tick{stroke:var(--ink);stroke-width:2}
.plate text{fill:var(--ink);font-family:var(--f-display);font-size:19px;font-weight:600}
.plate .sub{fill:var(--muted);font-family:var(--f-body);font-size:10px;font-weight:500}
.plate .sl label{display:flex;justify-content:space-between;font-size:14.5px;font-weight:500;gap:6px}
.plate .sl label i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.plate .note2{font-size:13px;color:var(--muted)}
.pledges{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pledge{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 10px;text-align:left;display:flex;gap:8px;align-items:flex-start;min-width:0}
.pledge .chk{width:22px;height:22px;border-radius:7px}
.pledge .chk svg{width:13px;height:13px}
.pledge b{font-weight:600;font-size:14px;display:block;line-height:1.2}
.pledge small{color:var(--muted);font-size:12px;display:block;line-height:1.25}
.pledge.on{background:var(--teal-soft);border-color:transparent}
.pledge.on .chk{background:var(--teal)}
.pledge.on .chk svg{stroke:var(--on-teal)}
.extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.xt{border:0;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-size:13.5px;font-weight:600;line-height:1.2;text-align:center}
.xt > svg{width:58px;height:58px}
.xt .rd{position:absolute;top:8px;right:8px}
.xt.on{box-shadow:inset 0 0 0 2px var(--teal)}
textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;resize:vertical;font-size:15px}

/* bottom bar */
nav.tabs{position:fixed;z-index:6;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px;box-shadow:0 8px 26px var(--shadow),0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
nav.tabs button{border:0;background:none;padding:7px 4px;font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px}
nav.tabs svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--teal)}
nav.tabs button.on svg .fl{fill:currentColor}

/* cards, forms */
.card{background:var(--surface);border-radius:20px;box-shadow:0 2px 10px var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;text-align:right;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0;min-height:46px}
input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
input[type=time]::-webkit-date-and-time-value{text-align:left}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.busy{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:10px}
.busy .field input{background:var(--surface)}
.busy .bh{display:flex;gap:6px;align-items:flex-end}
.busy .bh .field{flex:1}
.btn{border:0;background:var(--teal);color:var(--on-teal);border-radius:14px;padding:13px 16px;font-weight:600;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--teal);border:1.5px solid var(--teal)}
.btn.warn{background:var(--warn);color:#FFFDF8}
.btn.big{padding:15px 18px;font-size:17px;border-radius:16px}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:600;padding:4px 0;text-align:left}

/* plan timeline */
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:auto 38px minmax(0,1fr) 24px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tl > :first-child{border-top:0}
.tchip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 8px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:74px;text-align:center}
.tchip.ed{border-color:var(--teal);color:var(--teal)}
.tli .mini{width:38px;height:38px;border-radius:10px;overflow:hidden}
.tli .mini svg{width:100%;height:100%;display:block}
.tli .nm small{display:block;color:var(--muted);font-size:12.5px}
.tli .nm small.over{color:var(--warn);font-weight:600}
.tli.prep .nm,.tli.prep .tchip{color:var(--muted)}
.tli.prep .mini{opacity:.55}
.tline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.tline .tt{font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;text-align:center;font-size:13.5px}
.tline.busyrow{color:var(--muted);font-style:italic}
.tline.sandhya{color:var(--terra);font-size:13.5px}
.tedit{display:flex;gap:8px;align-items:center;padding:4px 0 12px}
.tedit input{flex:1;border:1px solid var(--teal);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:17px;min-height:46px}
.tick{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center}
.tick.on{background:var(--teal);border-color:var(--teal)}
.tick svg{width:14px;height:14px;stroke:var(--on-teal);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.segtabs{display:flex;background:var(--sand);border-radius:14px;padding:4px}
.segtabs button{flex:1;border:0;background:none;padding:8px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--muted)}
.segtabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}

/* progress */
.nightcard{background:var(--night);color:var(--on-night);border-radius:22px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;position:relative;overflow:hidden}
.nightcard h2{font-family:var(--f-display);font-weight:500;font-size:26px;margin:0 0 4px}
.nightcard .eb{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--night-muted);font-weight:600}
.nightcard .bigs{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.nightcard .big{display:flex;align-items:center;gap:6px}
.nightcard .big svg{width:28px;height:28px;stroke:var(--on-night);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nightcard .big b{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.nightcard .big small{font-size:13px;line-height:1.05;color:var(--night-muted)}
.nightcard .ill{width:92px;height:92px;align-self:end}
.nightcard .foot{grid-column:1/3;font-size:13.5px;color:var(--night-muted)}
.journey .jh{font-family:var(--f-display);font-size:26px;line-height:1.15}
.journey .js{color:var(--muted);font-size:14.5px;margin-top:2px}
.jtrack{position:relative;height:74px;margin:6px 10px 0}
.jtrack .ln{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:99px;background:var(--track)}
.jtrack .fill{position:absolute;left:0;top:14px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--terra),var(--teal))}
.jtrack .ms{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--track)}
.jtrack .ms.past{border-color:var(--teal);background:var(--teal)}
.jtrack .ms.sam{width:24px;height:24px;margin-left:-12px;top:5px;background:var(--night);border-color:var(--night);display:grid;place-items:center}
.jtrack .ms.sam svg{width:12px;height:12px;fill:var(--ill-glow)}
.jtrack .lb{position:absolute;top:34px;font-size:12px;line-height:1.2;color:var(--muted);transform:translateX(-50%);text-align:center;white-space:nowrap}
.jtrack .lb b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
.jtrack .lb.l{transform:translateX(-10px);text-align:left}
.jtrack .lb.r{transform:translateX(calc(-100% + 10px));text-align:right}
.jtrack .me{position:absolute;top:2px;width:30px;height:30px;margin-left:-15px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 0 0 3px var(--surface),0 2px 8px var(--shadow)}
.month h3{font-family:var(--f-display);font-weight:500;font-size:21px;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.month h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cell{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--track);position:relative;font-size:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:4px 5px;font-variant-numeric:tabular-nums;color:var(--muted);border:0;overflow:hidden}
.cell.pre{background:transparent;opacity:.45}
.cell.fut{background:transparent;border:1px dashed var(--line)}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.sel{box-shadow:0 0 0 2px var(--ink)}
.cell.blank{background:transparent}
.cell .ml2{font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1;color:var(--terra)}
.cell.d1{box-shadow:inset 0 0 0 2px var(--terra)}
.cell.half{background-image:linear-gradient(135deg,transparent 50%,color-mix(in srgb,var(--terra) 25%,transparent) 50%)}
.cell.sam{background:var(--night);color:var(--on-night)}
.cell.sam .ml2{color:var(--ill-glow);font-size:13px}
.cell .miss{position:absolute;right:4px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px;min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.1}
.stat small{color:var(--muted);font-size:12px;line-height:1.2;display:block}
.stat.hi b{color:var(--teal)}
.week{display:grid;grid-template-columns:62px repeat(7,1fr);gap:4px;align-items:center;font-size:12px}
.week .c{height:22px;border-radius:6px;background:var(--track)}
.week .c.y{background:var(--teal)}
.week .hd{text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:500;min-width:0}
.dl dd.y{color:var(--teal)}
.dl dd.n{color:var(--warn)}
.daylist{display:flex;flex-direction:column;gap:8px}
.daylist details{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px var(--shadow)}
.daylist summary{display:flex;justify-content:space-between;gap:8px;list-style:none;cursor:pointer}
.daylist summary::-webkit-details-marker{display:none}
.daylist summary small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.daylist .sc{color:var(--teal);font-variant-numeric:tabular-nums}
.daylist .inner{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.note{font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:16px 8px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:110px;height:110px}

/* profile & settings */
.phead{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0 4px}
.phead b{font-family:var(--f-display);font-size:24px;font-weight:500}
.phead small{color:var(--muted);font-size:14px}
.avwrap{position:relative}
.aved{position:absolute;right:-4px;bottom:-2px;width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);background:var(--teal);display:grid;place-items:center;padding:0}
.aved svg{width:15px;height:15px;stroke:var(--on-teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slist{background:var(--surface);border-radius:20px;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
.srow{width:100%;border:0;background:none;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.slist > * + *{border-top:1px solid var(--line)}
.sico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.sico svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.srow b{font-weight:500;font-size:16.5px;display:block}
.srow small{color:var(--muted);font-size:13px;display:block}
.srow .cv,.member .cv{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.srow.danger b{color:var(--warn)}
.lock svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 6px}
.clegend > span{display:inline-flex;align-items:center;gap:6px}
.clegend .lock svg{width:16px;height:16px}
.tog.mini{width:28px;height:16px;display:inline-block;pointer-events:none}
.tog.mini::after{width:12px;height:12px;top:2px;left:2px}
.tog.mini.on::after{transform:translateX(12px)}
.sadbar{position:fixed;z-index:8;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--night);color:var(--on-night);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px var(--shadow);font-size:14.5px;font-weight:500;animation:fadein .2s ease}
.sadbar span{flex:1;min-width:0}
.sadbar button{border:0;border-radius:11px;padding:9px 14px;font-weight:600;background:color-mix(in srgb,var(--on-night) 14%,transparent);color:var(--on-night)}
.sadbar button.on{background:var(--teal);color:var(--on-teal)}
#sadsheet .sheet{z-index:31}#sadsheet .sheet-bg{z-index:30}
.presets{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.preset{position:relative;border:0;background:var(--surface);border-radius:18px;padding:14px 12px 12px;box-shadow:0 2px 10px var(--shadow);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.preset.on{box-shadow:0 0 0 2px var(--teal),0 2px 10px var(--shadow)}
.preset .rd{position:absolute;top:10px;right:10px}
.preset b{font-size:16px;font-weight:600;line-height:1.2;padding-right:26px}
.preset small{color:var(--muted);font-size:12.5px;line-height:1.3}
.preset em{font-style:normal;font-size:12px;font-weight:600;color:var(--teal);margin-top:4px}
.mdemo{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:7px 8px;margin-top:6px}
.mdemo .chk{width:22px;height:22px;border-radius:7px}
.mdemo .chk svg{width:13px;height:13px;stroke:var(--on-teal)}
.mdemo .chk:not(.part){background:var(--teal)}
.mdemo b{font-size:13px;font-weight:600;display:block;line-height:1.2}
.mdemo small{font-size:11px;color:var(--muted);display:block;line-height:1.2}
.mdemo .pval{font-size:12px}
.cgrp{display:flex;flex-direction:column;gap:6px}
.cgh{font-family:var(--f-display);font-size:19px;padding:4px 4px 0}
.crow{width:100%;border:0;background:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;text-align:left}
.list > .crow + .crow,.list > .cextra + .crow,.list > .crow + .cform,.list > .cform + .crow{border-top:1px solid var(--line)}
.crow .thumb{width:44px;height:44px;border-radius:12px}
.crow .pname b{font-size:15.5px}
.crow .pname small{font-size:12.5px}
.crow .plus{display:grid;place-items:center;font-size:24px;font-weight:600;color:var(--f-leaf)}
.cextra{padding:0 14px 12px 70px;display:flex;flex-direction:column;gap:8px}
.cextra .pill{font-size:13px;padding:5px 11px}
.cform{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--teal-soft) 35%,var(--surface))}
@media (max-width:360px){.presets{grid-template-columns:1fr}.cextra{padding-left:14px}}
.sgroup{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px 0}
.tog{width:52px;height:30px;border-radius:999px;border:0;background:var(--track);position:relative;flex-shrink:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--shadow);transition:transform .15s}
.tog.on{background:var(--teal)}
.tog.on::after{transform:translateX(22px)}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.drow .mini{width:44px;height:44px;border-radius:12px;overflow:hidden}
.drow .mini svg{width:100%;height:100%;display:block}
.drow b{font-weight:500;font-size:15.5px;display:block;line-height:1.2}
.drow small{color:var(--muted);font-size:12.5px}
.drow .step button{width:36px;height:36px;font-size:18px}
.drow .step output{min-width:50px;font-size:15.5px}
.member{width:100%;border:0;background:none;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.member b{font-weight:600;font-size:16.5px;display:block}
.member small{color:var(--muted);font-size:13px;display:block}
.member .ring{width:46px;height:46px}
.member .ring svg{width:46px;height:46px}
.member .ring span{font-size:12px}
.colors{display:flex;gap:12px;margin-top:4px}
.colors button{width:40px;height:40px;border-radius:50%;border:0}
.colors button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.banner{display:flex;gap:12px;align-items:center;background:var(--sand);border-radius:18px;padding:12px 14px;font-size:14px}
.banner svg{width:64px;height:64px;flex-shrink:0}

/* onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 28px;gap:18px}
.ob .sky{border-radius:28px;overflow:hidden;box-shadow:0 10px 30px var(--shadow)}
.ob .sky svg{display:block;width:100%;height:auto}
.ob h1{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.ob h2{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.ob p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.ob .eb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);font-weight:700}
.ob .grow{flex:1}
.ob .dotsrow{display:flex;gap:6px;justify-content:center}
.ob .dotsrow i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ob .dotsrow i.on{background:var(--teal);width:20px;border-radius:99px}
.pick{display:flex;flex-direction:column;gap:10px}
.pickrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:0;border-radius:18px;padding:12px 14px;box-shadow:0 2px 10px var(--shadow);text-align:left}
.pickrow .av{width:52px;height:52px}
.pickrow b{font-size:18px;font-weight:600;display:block}
.pickrow small{color:var(--muted);font-size:13.5px}
.pickrow .cv{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.facts{display:flex;flex-direction:column;gap:10px}
.fact{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px}
.fact .mini{width:48px;height:48px;border-radius:12px;overflow:hidden}
.fact .mini svg{width:100%;height:100%;display:block}
.fact b{display:block;font-weight:600}
.fact small{color:var(--muted);font-size:13.5px}
.ob .grid2 input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;min-width:0;width:100%}
.big-input{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-size:20px;width:100%;font-family:var(--f-display)}

/* living illustrations */
.shd{fill:var(--ill-hair);opacity:.13}
.fold{fill:none;stroke:var(--ill-robe-d);stroke-width:1.1;stroke-linecap:round;opacity:.45}
.neck{fill:none;stroke:var(--ill-skin-l);stroke-width:1;opacity:.9}
.eye{fill:none;stroke:var(--ill-hair);stroke-width:.75;stroke-linecap:round}
.gr{fill:url(#gRobe)} .gl2{fill:url(#gLeg)} .gs{fill:url(#gSkin)} .gg{fill:url(#gGlow)}
.lg{fill:none;stroke:var(--ill-robe);stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round}
.arm{fill:none;stroke:var(--ill-skin);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sleeve{fill:none;stroke:var(--ill-robe2);stroke-width:4.4;stroke-linecap:round}
.mango{fill:url(#gMango)} .bowl{fill:url(#gBowl)} .scr{fill:url(#gScreen)}
.anim-glow{animation:aglow 3.6s ease-in-out infinite}
@keyframes aglow{50%{opacity:.35}}
.anim-steam{animation:asteam 3.2s ease-in-out infinite;transform-box:fill-box}
.anim-steam.d2{animation-delay:1.1s}
@keyframes asteam{0%{transform:translateY(4px);opacity:0}35%{opacity:.9}100%{transform:translateY(-5px);opacity:0}}
.anim-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:abreathe 6s ease-in-out infinite}
@keyframes abreathe{50%{transform:scale(1.015,1.035)}}
.anim-halo{transform-box:fill-box;transform-origin:center;animation:ahalo 5s ease-in-out infinite}
@keyframes ahalo{50%{transform:scale(1.2);opacity:.45}}
.anim-cloud{animation:acloud 120s linear infinite}
.anim-cloud.slow{animation-duration:170s}
@keyframes acloud{from{transform:translateX(-80px)}to{transform:translateX(460px)}}
.anim-birds{animation:abirds 30s linear infinite}
@keyframes abirds{0%{transform:translate(-40px,80px)}100%{transform:translate(420px,14px)}}

  const both=I.hathaBoth||C.hatha==='both'||kind==='weekend';
  const hatha=both?[...PREP(1),{id:'surya',label:'Surya practice',d:D.surya},{id:'as',label:'Yogasanas',d:D.asanas}]
    :[...PREP(1),{id:'hatha',label:'Surya or Yogasanas',d:Math.max(D.surya,D.asanas)}];
  seq([...(A.bhuta?[{id:'bs',label:'Bhuta Shuddhi',d:D.bhuta}]:[]),...hatha,{id:'sck1',label:'Shakti Chalana Kriya',d:D.sck,kriya:1},...PREP(2),
       {id:'sha1',label:'Shambhavi',d:D.shambhavi,kriya:1}],r.wake);
  // Sukha Kriya: a full hour in a sandhya kala; otherwise sittings of 20+ minutes across the sandhyas
  const W=[sn.rise,sn.noon,sn.set],inW=(d)=>{for(const w of W)for(let t=r5(w-20);t<=w+20;t+=5) if(free(t,t+d)) return t;return null};
  let st=inW(D.sukha);
  if(st!=null) place({id:'sukha',label:'Sukha Kriya',d:D.sukha},st);
  else{const part=Math.max(20,Math.ceil(D.sukha/3/5)*5),got=[];
    for(const w of W){if(got.length*part>=D.sukha)break;for(let t=r5(w-20);t<=w+20;t+=5) if(free(t,t+part)){got.push(t);occ.push([t,t+part]);break}}
    if(got.length*part>=D.sukha){occ.splice(occ.length-got.length);got.forEach((t,i)=>place({id:'sukha'+(i+1),label:'Sukha Kriya · sitting '+(i+1),d:part},t))}
    else place({id:'sukha',label:'Sukha Kriya',d:D.sukha},find(r.wake,D.sukha))}
  const shoOk=t=>t>=660&&kEnds.every(e=>t<e||t>=e+SHOONYA_GAP);
  const s1=find(660,D.shoonya,shoOk);place({id:'sho1',label:'Shoonya',d:D.shoonya,sho:1},s1);
  const s2=find(Math.max(17*60,(s1??660)+D.shoonya+120),D.shoonya,t=>shoOk(t)&&(s1==null||t>=s1+D.shoonya+120));
  place({id:'sho2',label:'Shoonya (2nd)',d:D.shoonya,sho:1},s2);
  if(I.kriya2) seq([{id:'sck2',label:'Shakti Chalana Kriya (2nd)',d:D.sck,kriya:1},...PREP(4),{id:'sha2',label:'Shambhavi (2nd)',d:D.shambhavi,kriya:1}],
      Math.max(sn.set+10,18*60),(t,tot)=>shoS.every(s=>s<t||s>=t+tot+SHOONYA_GAP));
  const after=Math.max(...out.filter(x=>x.s!=null).map(x=>x.s+x.d),r.wake);
  if(A.aum) place({id:'aum',label:'AUM chanting',d:D.aum},find(Math.min(after,19*60),D.aum));
  C.custom.filter(c=>c.plan>0).forEach(c=>place({id:'c:'+c.id,label:c.name,d:c.plan},find(r.wake,c.plan)));

}
function planDone(id,l){if(id.startsWith('c:')){const c=custById(ME,id.slice(2));return c?custVal(c,l)>=1:false}

const planTile=id=>id.startsWith('sukha')?'peach':id.startsWith('c:')?'sage':({bs:'sage',surya:'peach',as:'rose',hatha:'peach',sck1:'night',sck2:'night',sha1:'dusk',sha2:'dusk',sho1:'sand',sho2:'sand',aum:'night'})[id]||'sand';
// what a plan item is called on a given day

function sortedPlan(r){return (r.plan||[]).map((x,i)=>({...x,i})).sort((a,b)=>(a.s??9999)-(b.s??9999))}

/* ---------- coach ---------- */
function coach(p,k){
  const l=get(p,k),sc=score(l,p),today=k===todayK(),now=nowMin(),r=routineFor(p,k),D=S.people[p].durs,ph=phaseOf(k);
  const st=sukT(l),mx=sukMax(l);
  const C=sadAt(p,k),I=C.int,A=C.add,f=hathaFocus(k,p),pend=[];
  // Isha mandatory first
  if(!hathaOk(l)) pend.push({t:f==='as'?'Yogasanas':f==='surya'?SURYA[C.surya[0]].n:'Surya or Yogasanas',m:f==='as'?D.asanas:D.surya+D.prep,nn:1,key:f==='as'?'as':'surya',ill:f==='as'?'as':'sk',tile:f==='as'?'rose':'peach'});
  if(l.sck<1) pend.push({t:'SCK',m:D.sck,nn:1,key:'sck',ill:'sck',tile:'night'});
  if(l.shambhavi<1) pend.push({t:'Shambhavi',m:D.shambhavi+D.prep,nn:1,key:'shambhavi',ill:'shambhavi',tile:'dusk'});
  if(l.shoonya<2) pend.push({t:l.shoonya?'Shoonya, 2nd':'Shoonya',m:D.shoonya,nn:1,key:'shoonya',ill:'shoonya',tile:'sand'});
  if(!sukOk(l)) pend.push({t:st?'Sukha Kriya, '+(60-st)+'m more':'Sukha Kriya',m:Math.max(20,60-st),nn:1,key:'sukha',ill:'sukha',tile:'peach'});
  if(!dietOk(l)) pend.push({t:'Diet',m:0,nn:1,key:'food',ill:'sprouts',tile:'sage'});
  if(!natOk(l)) pend.push({t:'Natural food',m:0,nn:1,key:'food',ill:'fruits',tile:'peach'});
  // then whatever else is switched on
  if(A.bhuta&&!l.bhuta) pend.push({t:'Bhuta Shuddhi',m:D.bhuta,key:'bhuta',ill:'bhuta',tile:'sage'});
  if((I.hathaBoth||f==='both')&&hathaOk(l)&&!(suryaOk(l)&&asOk(l))) pend.push({t:suryaOk(l)?'Yogasanas':'Surya practice',m:suryaOk(l)?D.asanas:D.surya,key:suryaOk(l)?'as':'surya',ill:suryaOk(l)?'as':'sk',tile:suryaOk(l)?'rose':'peach'});
  if(I.kriya2&&l.sck===1) pend.push({t:'SCK, 2nd',m:D.sck,key:'sck',ill:'sck',tile:'night'});
  if(I.kriya2&&l.shambhavi===1) pend.push({t:'Shambhavi, 2nd',m:D.shambhavi,key:'shambhavi',ill:'shambhavi',tile:'dusk'});
  if(A.aum&&!(l.aum>0||l.qd.aum)) pend.push({t:'AUM chanting',m:D.aum,key:'aum',ill:'aum',tile:'night'});
  if(A.screen&&today&&now>=18*60&&!l.scrDone&&!l.qd.screen) pend.push({t:'Screen time',m:0,key:'scard',ill:'screen',tile:'dusk'});
  C.custom.forEach(c=>{if(custVal(c,l)<1)pend.push({t:c.name,m:c.kind==='time'?c.target||10:10,key:'c-'+c.id,ill:'prep',tile:'sage'})});
  const nnPend=pend.filter(x=>x.nn),met=mandMet(l);
  const chips=[];
  const sk=streak(p); if(sk>=2) chips.push(sk+'-day mandatory streak');
  if(met===MAND_N) chips.push('All Isha mandatory met');
  if(mx>=60) chips.push('Sukha Kriya: full hour in one stretch');
  if(l.nat>=50) chips.push(l.nat+'% natural food');
  if(A.screen&&l.digital!=null&&l.digital<=SCREEN_IDEAL) chips.push('Screens under 1.5h');
  const y=addD(k,-1); if(logged(p,y)){const d=sc-score(get(p,y),p); if(d>0) chips.push('+'+d+'% vs yesterday')}

  let title,sub='',todo=pend,todoLabel='Left to do today',note='',next=null,alert='';
  if(A.screen&&l.digital!=null&&l.digital>SCREEN_MAX) alert='Screen time is '+dur(l.digital)+', above the 2-hour limit.';
  if(!today){
    title=logged(p,k)?(met===MAND_N?'All Isha mandatory was kept':'Isha mandatory · '+met+' of '+MAND_N+' met'):'Nothing logged for this day';
    sub=pretty(k);todoLabel='Not done this day';
  } else if(!pend.length){
    title='Every practice is complete';sub='Keep the evening quiet and sleep on time.';
  } else if(now>=17*60){
    const left=Math.max(0,r.sleep-now);
    title=nnPend.length?'Evening. Mandatory comes first':'Evening. There is still time';
    let acc=0;const fit=[];for(const x of pend){if(acc+x.m<=left){fit.push(x);acc+=x.m}}
    if(left<=0){sub='It is past your planned bedtime.';todoLabel='Still pending'}
    else{sub=dur(left)+' before bed at '+fmt(r.sleep)+'.';if(fit.length){todo=fit;todoLabel='These fit before bed'}else todoLabel='Do the shortest one you can'}
    if(nnPend.some(x=>x.key==='shoonya')&&nnPend.some(x=>x.key==='sck')) note='Do Shoonya first. It should not come straight after a kriya.';
  } else {
    title=met+' of '+MAND_N+' Isha mandatory met';
    sub=(ph.kind==='build'?'Build-up day':ph.kind==='full'?'Day '+ph.n+' of 60':'Samyama')+' · '+pend.length+' left'+(nnPend.length?', '+nnPend.length+' mandatory':'')+'.';
  }
  if(today){
    const pl=sortedPlan(r).filter(x=>x.s!=null&&!x.prep&&!planDone(x.id,l)&&x.s+x.d>=now);
    if(pl.length) next={...pl[0],label:planLabel(pl[0],k)};
  }
  const quote=QUOTES[(diff('2026-01-01',k)%QUOTES.length+QUOTES.length)%QUOTES.length];
  return {title,sub,todo,todoLabel,note,chips,next,quote,now,alert,sc};
}

        </div>
      </div>`;
  const lifeRows=[
    A.screen?(simple?q('screen','Screen time','Phone + TV within 2 hours','screen','dusk',!!l.qd.screen)
      :prow({key:'digital',name:'Screen time',sub:l.digital==null?scrState[0]:dur(l.digital)+' · '+scrState[0].toLowerCase(),subc:scrState[1],ill:'screen',tile:'dusk',state:scrState[2],right:l.digital!=null?dur(l.digital):'',
      body:ctl('Phone','scrPhone',l.scrPhone,15,720,true)+ctl('TV and other screens','scrTv',l.scrTv,15,720,true)+`<div class="hint">${screenGuide()}</div>`})):'',
    A.silence?(simple?q('silence','Silence','Spent time in silence','silence','night',!!l.qd.silence)

const CALI='<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M12 14h2M16 14h0M8 17h2M12 17h2"/></svg>';
function stripStart(){const tk=todayK(),f=firstKey(ME),a=addD(tk,-20);return f<a?f:a}
function dayStrip(){
  const tk=todayK();let k=stripStart();const out=[];
  while(k<=tk){const lg=logged(ME,k),s=lg?score(get(ME,k)):0,d=parse(k);
    out.push(`<button class="dchip${k===V.day?' on':''}${k===tk?' tdy':''}" data-a="goday" data-k="${k}" aria-label="${pretty(k)}${lg?', '+s+'%':''}"><small>${k===tk?'Today':DOW[d.getDay()]}</small><b>${d.getDate()}</b><i class="${lg?'':'no'}" style="--s:${s}%"></i></button>`);k=addD(k,1)}
  return `<div class="dayrow"><div class="dstrip" id="dstrip">${out.join('')}</div><button class="calbtn" data-a="sheet" data-for="today" aria-label="Go to any day">${CALI}</button></div>`;
}
function renderSheet(){
  let el=document.getElementById('sheet');
  if(!V.sheet){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='sheet';document.body.appendChild(el)}
  const tk=todayK(),f=firstKey(ME),lo=f<addD(tk,-45)?f:addD(tk,-45);
  let y=parse(lo).getFullYear(),m=parse(lo).getMonth();const ty=parse(tk).getFullYear(),tm=parse(tk).getMonth();const months=[];
  while(y<ty||(y===ty&&m<=tm)){
    const mk=y+'-'+pad(m+1),days=new Date(y,m+1,0).getDate(),lead=(new Date(y,m,1).getDay()+6)%7;let cells='';
    for(let i=0;i<lead;i++)cells+='<div class="cell blank"></div>';
    for(let d=1;d<=days;d++){const c=mk+'-'+pad(d),lg=logged(ME,c),s=lg?score(get(ME,c)):0;
      const cls='cell'+(c===tk?' today':'')+(c===V.day&&V.pickFor==='today'?' sel':'')+(c===DAY1?' d1':'');
      cells+=c>tk?`<div class="${cls} fut"><span>${d}</span></div>`:`<button class="${cls}" data-a="pickday" data-k="${c}" style="background-color:color-mix(in srgb,var(--teal) ${lg?Math.max(14,s):0}%,var(--track));${s>55?'color:var(--on-teal)':''}"><span>${d}</span>${lg?`<span class="ml2" style="color:inherit;opacity:.8">${s}%</span>`:''}</button>`}
    months.push(`<div class="month"><h3 style="font-size:18px;margin:4px 0 6px">${MONL[m]}${y!==2026?' '+y:''}</h3><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></div>`);
    m++;if(m>11){m=0;y++}}
  const q=[[tk,'Today'],[addD(tk,-1),'Yesterday']];if(DAY1<=tk)q.push([DAY1,'Day 1']);
  el.innerHTML=`<div class="sheet-bg" data-a="sheetclose"></div><div class="sheet" role="dialog" aria-label="Go to a day"><div class="grab"></div>
    <h3>${V.pickFor==='list'?'Open a day':'Go to a day'}<button class="back" data-a="sheetclose" aria-label="Close" style="box-shadow:none">✕</button></h3>

}

/* ---------- My day ---------- */

/* ---------- Progress ---------- */
function dayLines(l,p){
  p=p||ME;const C=sadAt(p,l._k),st=sukT(l),mx=sukMax(l),j=a=>a.filter(Boolean).join(', '),dn=v=>v?'Done':'—';
  const cyc=n=>n+' cycle'+(n>1?'s':'');
  const rows=[];
  if(C.add.bhuta||l.bhuta) rows.push(['Bhuta Shuddhi',l.bhuta?'Done':'—',l.bhuta||null]);
  const sur=j(['sk','ss','sn'].filter(x=>l[x]).map(x=>SURYA[x].n+' '+cyc(l[x])))||(l.qd.surya?'Done':'—');
  rows.push(['Surya',sur,suryaOk(l)?true:null]);
  rows.push(['Yogasanas',l.asCyc?l.asCyc+' × '+secLabel(l.asSec):dn(l.qd.as),asOk(l)?true:null]);
  rows.push(['Hatha mandatory',hathaOk(l)?'Met':'Not met',hathaOk(l)]);
  rows.push(['Shakti Chalana Kriya',l.sck+'/2',l.sck>=1]);
  rows.push(['Shambhavi',l.shambhavi+'/2',l.shambhavi>=1]);
  rows.push(['Shoonya',l.shoonya+'/2',l.shoonya>=2]);
  rows.push(['Sukha Kriya',st?dur(st)+(l.sits.length>1?' ('+l.sits.map(dur).join(' + ')+')':'')+(mx>=60?' · full hour':''):l.qd.sukha?'60m done':'—',sukOk(l)]);
  if(C.add.aum||l.aum) rows.push(['AUM chanting',l.aum?dur(l.aum):dn(l.qd.aum),null]);
  rows.push(['Ardha Siddhasana',l.ardha?'Longest '+dur(l.ardha):'—',l.ardha>=90?true:null]);
  const sup=j([l.patanga&&'Patangasana',l.shishu&&'Shishupalasana']);if(sup)rows.push(['Supporting',sup,null]);
  rows.push(['Diet pledges',j([l.dNeg&&'No negative-pranic',l.dStim&&'No stimulants',l.dNonveg&&'No non-veg',l.dDairy&&'No dairy',l.dOut&&'No outside food',l.sattvic&&'Sattvic'])||'—',dietOk(l)]);
  rows.push(['Natural food',l.nat?l.nat+'%':l.qd.nat?'50%+':'—',natOk(l)]);
  const also=j([l.sprouts&&'Sprouts',l.peanuts&&'Soaked groundnuts',l.sanj&&'Kanji']);if(also)rows.push(['Also had',also,null]);
  if(C.add.screen||l.digital!=null) rows.push(['Screen time',l.digital==null?(l.qd.screen?'Within 2h':'—'):dur(l.digital),l.digital==null?(l.qd.screen?true:null):l.digital<=SCREEN_MAX]);
  if(C.add.silence||l.silence) rows.push(['Silence',l.silence?l.silence+'h':dn(l.qd.silence),null]);
  C.custom.forEach(c=>{const v=l.cust[c.id];rows.push([c.name,l.qd['c:'+c.id]?'Done':c.kind==='done'?dn(v):c.kind==='rounds'?(v||0)+'/'+c.rounds:v?(c.kind==='time'?dur(v):v+' '+(c.unit||'')):'—',custVal(c,l)>=1?true:null])});
  return rows;
}
const dlHTML=(l,p)=>`<dl class="dl">${dayLines(l,p).map(([a,b,ok])=>`<dt>${esc(a)}</dt><dd class="${ok===true?'y':ok===false?'n':''}">${esc(b)}</dd>`).join('')}</dl>${l.note?`<div class="note"><b>Note:</b> ${esc(l.note)}</div>`:''}`;

function journey(p,ro){
  const k=todayK(),ph=phaseOf(k),start=firstKey(p)<DAY1?firstKey(p):addD(DAY1,-14);
  let h,s;
  if(ph.kind==='build'){h=ph.toDay1+' day'+(ph.toDay1>1?'s':'')+' until Day 1';s=ro?'In the build-up.':'Build up gently. Every day of practice now makes Day 1 easier.'}
  else if(ph.kind==='full'){const n=ph.n;
    if(n<30){h='Day '+n+' of 60';s=(30-n)+' day'+(30-n>1?'s':'')+' to the halfway mark.'}
    else if(n===30){h='Halfway there';s='30 days done, 30 to go.'}
    else if(n<54){h='Past halfway';s=(60-n)+' days of preparation left.'}
    else if(n<60){h='The final week';s=(60-n)+' day'+(60-n>1?'s':'')+' left. Samyama begins '+short(SAMYAMA)+'.'}
    else{h='Last day of preparation';s='Samyama begins tomorrow.'}}
  else{h=ph.toSam===0?'Samyama begins today':ph.toSam>0?'Samyama in '+ph.toSam+' day'+(ph.toSam>1?'s':''):'Samyama';s='The preparation is complete.'}
  // four evenly spaced milestones; today sits proportionally within its segment
  const M=[[start,'Build-up',short(start)],[DAY1,'Day 1',short(DAY1)],[HALF,'Halfway',short(HALF)],[SAMYAMA,'Samyama',short(SAMYAMA)]];
  let pos=0;for(let i=0;i<3;i++){const a=M[i][0],b=M[i+1][0];if(k>=a&&k<=b){pos=(i+diff(a,k)/Math.max(1,diff(a,b)))/3;break}else if(k>b)pos=(i+1)/3}
  pos=Math.max(0,Math.min(1,pos));
  const P=x=>(x*100).toFixed(2)+'%';
  return `<section class="card journey">
    <h2>The journey <span>${ph.kind==='build'?'Build-up':ph.kind==='full'?'Day '+ph.n:'Samyama'}</span></h2>
    <div><div class="jh">${h}</div><div class="js">${s}</div></div>
    <div class="jtrack">
      <div class="ln"></div><div class="fill" style="width:${P(pos)}"></div>
      ${M.map((m,i)=>`<span class="ms${k>=m[0]&&i<3?' past':''}${i===3?' sam':''}" style="left:${P(i/3)}">${i===3?STAR:''}</span>
        <span class="lb${i===0?' l':i===3?' r':''}" style="left:${P(i/3)}"><b>${m[1]}</b>${m[2]}</span>`).join('')}
      <span class="me av c-${S.people[p].color}" style="left:${P(pos)}">${avInner(p)}</span>
    </div>
  </section>`;
}

function months(p,ro){
  const start=firstKey(p),tk=todayK();
  const first=parse(start<DAY1?start:DAY1);let y=first.getFullYear(),m=first.getMonth();
  const endD=parse(SEND),eY=endD.getFullYear(),eM=endD.getMonth();
  const out=[];
  while(y<eY||(y===eY&&m<=eM)){
    const mk=y+'-'+pad(m+1);const days=new Date(y,m+1,0).getDate();const lead=(new Date(y,m,1).getDay()+6)%7;
    let cells='';for(let i=0;i<lead;i++)cells+='<div class="cell blank"></div>';
    let cnt=0;const tags=[];
    for(let d=1;d<=days;d++){
      const c=mk+'-'+pad(d);const lg=logged(p,c),l=get(p,c),s=lg?score(l,p):0;if(lg)cnt++;
      const inSam=c>=SAMYAMA&&c<=SEND;
      const ms=c===DAY1?'Day 1':c===HALF?'Half':c===LAST?'Day 60':c===SAMYAMA?'✦':'';
      if(c===DAY1)tags.push('Day 1 on the '+d+'th');if(c===HALF)tags.push('Halfway on the '+d+'th');if(c===SAMYAMA)tags.push('Samyama from the '+d+'th');
      const cls='cell'+(c===DAY1?' d1':'')+(c===HALF?' half':'')+(inSam?' sam':'')+(c===tk?' today':'')+(V.sel===c?' sel':'');
      const lab=`<span>${d}</span>${ms?`<span class="ml2">${ms}</span>`:''}`;
      if(inSam||c>tk) cells+=`<div class="${cls}${inSam?'':' fut'}">${lab}</div>`;
      else if(c<start&&!lg) cells+=`<div class="${cls} pre">${lab}</div>`;
      else cells+=`<button class="${cls}" data-a="sel" data-k="${c}" style="background-color:color-mix(in srgb,var(--teal) ${lg?Math.max(12,s):0}%,var(--track));${s>55?'color:var(--on-teal)':''}" aria-label="${pretty(c)} ${s}%">${lab}${lg&&!nnOk(l)?'<span class="miss"></span>':''}</button>`;
    }
    const tag=cnt?cnt+' day'+(cnt>1?'s':'')+' logged':(tags[0]||'');
    out.push(`<section class="card month"><h3>${MONL[m]}${y!==2026?' '+y:''}<span>${tag}</span></h3>
      <div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></section>`);
    m++;if(m>11){m=0;y++}
  }
  const sel=V.sel&&V.sel<=tk?V.sel:null,sl=sel?get(p,sel):null;
  return out.join('')+`<div class="legend" style="padding:0 6px"><span><i style="background:var(--track)"></i>Low</span><span><i style="background:var(--teal)"></i>Full day</span><span><i style="background:var(--warn);border-radius:50%"></i>Mandatory missed</span><span><i style="box-shadow:inset 0 0 0 2px var(--terra)"></i>Day 1</span><span><i style="background:var(--night)"></i>Samyama</span></div>
    ${sel?`<section class="card"><h2>${pretty(sel)} <span>${logged(p,sel)?score(sl,p)+'%':'Not logged'}</span></h2>${dlHTML(sl,p)}${ro?'':`<button class="btn ghost" data-a="goto" data-k="${sel}">Edit this day</button>`}</section>`:''}`;
}

/* ---------- charts ---------- */
function niceMax(v,steps){for(const s of steps)if(v<=s)return s;return Math.ceil(v/60)*60}
function xLabels(keys,W,L,R){
  const n=keys.length,bw=(W-L-R)/n,idx=n<=7?keys.map((_,i)=>i):[0,Math.floor((n-1)/2),n-1];
  return idx.map(i=>{const d=parse(keys[i]);return `<text class="ax" x="${L+bw*(i+.5)}" y="146" text-anchor="${n<=7?'middle':i===0?'start':i===n-1?'end':'middle'}">${n<=7?DOW[d.getDay()].slice(0,2):d.getDate()+' '+MON[d.getMonth()]}</text>`}).join('');
}
function barChart(o){
  const W=320,H=150,L=30,R=6,T=10,B=20,n=o.keys.length,bw=(W-L-R)/n;
  const vals=o.vals,dots=o.dots||[],all=[...vals,...dots].filter(v=>v!=null);
  const mx=niceMax(Math.max(o.target||0,...all,1),o.steps||[30,60,90,120,180,240,360]);
  const y=v=>T+(H-T-B)*(1-v/mx);
  const grid=[0,mx/2,mx].map(v=>`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-4}" y="${y(v)+3}" text-anchor="end">${o.fmt(v)}</text>`).join('');
  let bars='',hits='',dd='';
  vals.forEach((v,i)=>{const x=L+i*bw,w=Math.max(1.6,bw*.62),bx=x+(bw-w)/2;
    if(v){const yt=y(v),yb=y(0),r=Math.min(3,w/2,(yb-yt));bars+=`<path class="bar" data-b="${i}" d="M${bx} ${yb}V${yt+r}Q${bx} ${yt} ${bx+r} ${yt}H${bx+w-r}Q${bx+w} ${yt} ${bx+w} ${yt+r}V${yb}Z"/>`}
    if(dots[i]) dd+=`<circle class="dt" cx="${x+bw/2}" cy="${y(dots[i])}" r="${Math.min(3.6,Math.max(2.4,bw*.3))}"/>`;
    hits+=`<rect class="hit" data-a="tip" data-i="${i}" data-t="${esc(o.tip(i))}" x="${x}" y="${T}" width="${bw}" height="${H-T-B}"/>`});
  const tg=o.target?`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y(o.target)}" y2="${y(o.target)}"/><text class="ax" x="${W-R}" y="${y(o.target)-4}" text-anchor="end">${o.tlabel}</text>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${grid}${bars}${dd}${tg}${xLabels(o.keys,W,L,R)}${hits}</svg><div class="tipline">${o.hint||'Tap a day to see its value'}</div></div>`;
}
function lineChart(o){
  const W=320,H=150,L=30,R=6,T=10,B=20,n=o.keys.length,bw=(W-L-R)/n;
  const vals=o.vals,mx=niceMax(Math.max(o.target||0,...vals.filter(v=>v!=null),1),o.steps||[30,60,90,120,180]);
  const y=v=>T+(H-T-B)*(1-v/mx),x=i=>L+bw*(i+.5);
  const grid=[0,mx/2,mx].map(v=>`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-4}" y="${y(v)+3}" text-anchor="end">${o.fmt(v)}</text>`).join('');
  const pts=vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  const line=pts.length?'M'+pts.map(p=>p.join(' ')).join('L'):'';
  const area=pts.length>1&&o.area?`<path class="ar" d="${line}L${pts[pts.length-1][0]} ${y(0)}L${pts[0][0]} ${y(0)}Z"/>`:'';
  let dots='',hits='';vals.forEach((v,i)=>{if(v!=null&&(n<=40||i===n-1))dots+=`<circle class="pt" data-b="${i}" cx="${x(i)}" cy="${y(v)}" r="${n<=14?3.6:2.6}"/>`;
    hits+=`<rect class="hit" data-a="tip" data-i="${i}" data-t="${esc(o.tip(i))}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}"/>`});
  const tg=o.target?`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y(o.target)}" y2="${y(o.target)}"/><text class="ax" x="${W-R}" y="${y(o.target)-4}" text-anchor="end">${o.tlabel}</text>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${grid}${area}<path class="ln" d="${line}"/>${dots}${tg}${xLabels(o.keys,W,L,R)}${hits}</svg><div class="tipline">${o.hint||'Tap a day to see its value'}</div></div>`;
}
function CROWS(p){const C=sadOf(p),I=C.int,A=C.add,r=[];
  if(A.bhuta)r.push(['Bhuta Shuddhi',l=>+l.bhuta]);
  r.push(['Hatha',l=>suryaOk(l)&&asOk(l)?1:hathaOk(l)?(I.hathaBoth?.5:1):0]);
  r.push(['Shakti Chalana',l=>I.kriya2?Math.min(2,l.sck)/2:+(l.sck>=1)],['Shambhavi',l=>I.kriya2?Math.min(2,l.shambhavi)/2:+(l.shambhavi>=1)],['Shoonya',l=>l.shoonya/2]);
  r.push(['Sukha Kriya',l=>sukOk(l)?1:sukT(l)>0?.5:0]);
  if(A.aum)r.push(['AUM chanting',l=>l.aum>0||l.qd.aum?1:0]);

  if(A.screen)r.push(['Screens',l=>l.qd.screen||(l.digital!=null&&l.digital<=SCREEN_MAX)?1:0]);

function hathaTrends(keys,L,LL,tipD,p){

function sadDiff(A,B){
  const items=C=>{const m={};INT.forEach(x=>{if(C.int[x.id])m['i'+x.id]=x.n});ADDS.forEach(x=>{if(C.add[x.id])m['a'+x.id]=x.n});C.custom.forEach(c=>m['c'+c.id]=c.name);return m};
  const a=items(A),b=items(B),out=[];
  Object.keys(b).forEach(k=>{if(!a[k])out.push(['Adding',b[k]])});
  Object.keys(a).forEach(k=>{if(!b[k])out.push(['Removing',a[k]])});
  if(A.surya.join()!==B.surya.join())out.push(['Surya practice',B.surya.map(x=>SURYA[x].n).join(' or ')]);
  const hp=C=>C.int.hathaBoth?'both':C.hatha;
  if(hp(A)!==hp(B)&&!B.int.hathaBoth)out.push(['Hatha pattern',{alt:'Yogasanas Mon, Wed, Fri',alt2:'Surya Mon, Wed, Fri',both:'Both daily'}[B.hatha]]);
  return out}

const VAPID='__VAPID__';

async function pushStatus(){if(!PUSH_OK)return 'unsupported';if(isIOS&&!standalone())return 'install';if(Notification.permission==='denied')return 'denied';
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();return sub?'on':'off'}catch(e){return 'off'}}

  const perm=await Notification.requestPermission();if(perm!=='granted'){V.push=perm==='denied'?'denied':'off';render();return}
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    const {error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,user_id:ME,sub:sub.toJSON()},{onConflict:'endpoint'});if(error)throw error;
    V.push='on';V.toast='Notifications are on for this phone.'}catch(e){console.warn('push',e);V.toast='Could not turn on notifications: '+(e.message||e)}
  render()}
async function pushDisable(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
  if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}V.push='off';render()}
async function pushTimerJob(){if(!CLOUD||!ME||!TM||!TM.target||!TM.run||V.push!=='on')return;

/* ---------- sitting timer ----------
   Counts from timestamps, so it stays right when the phone locks or the app is closed.
   Finishing logs the minutes to the practice on the day the sitting began. */
const TSTORE=STORE+'-timer';
let TM=null;try{TM=JSON.parse(ls.get(TSTORE))}catch(e){TM=null}
const timedList=()=>{const C=sadOf(ME),o=[{k:'sukha',n:'Sukha Kriya',ill:'sukha',tile:'peach',target:60},{k:'ardha',n:'Ardha Siddhasana',ill:'ardha',tile:'sage',target:90}];
  if(C.add.aum)o.push({k:'aum',n:'AUM chanting',ill:'aum',tile:'night',target:0});
  C.custom.filter(c=>c.kind==='time').forEach(c=>o.push({k:'c:'+c.id,n:c.name,ill:'prep',tile:'sage',target:c.target||0}));return o};
const tmInfo=k=>timedList().find(x=>x.k===k)||{k,n:'Sitting',ill:'sukha',tile:'peach',target:0};
const tmEl=()=>TM?TM.acc+(TM.run?Date.now()-TM.start:0):0;
const tmSave=()=>{if(TM)ls.set(TSTORE,JSON.stringify(TM));else ls.del(TSTORE)};
const mmss=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)};
// bells are synthesised, so nothing has to download
let AC=null;
function bell(strong){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,g=AC.createGain();g.connect(AC.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(strong?.5:.3,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+(strong?6:3.5));
  [[528,1],[1056,.4],[1584,.18],[792,.25]].forEach(([f,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=f;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+(strong?6:3.5))});
  if(strong&&navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}}

function renderTimer(){
  let el=document.getElementById('timer');

      ${s.k==='sukha'?`<div class="ctrl"><span>Sitting in Ardha Siddhasana<br><small class="hint">Also counts toward your longest sit</small></span><button class="tog${s.ardha?' on':''}" data-a="tmtog" data-k="ardha" role="switch" aria-checked="${s.ardha}" aria-label="In Ardha Siddhasana"></button></div>`:''}
      <div class="ctrl"><span>Keep the screen on</span><button class="tog${s.awake?' on':''}" data-a="tmtog" data-k="awake" role="switch" aria-checked="${s.awake}" aria-label="Keep the screen on"></button></div>
      <div class="hint">${s.target?'A bell rings at '+dur(s.target)+'. ':''}The timer keeps counting if the phone locks. Allow notifications in Profile → Reminders to hear the end bell with the app closed.</div>
      <div class="grow"></div><button class="btn big" data-a="tmstart">Start</button></div>`;return}

async function pushNow(){
  if(!CLOUD||!ME||syncing)return;syncing=true;
  S.synced=S.synced||{};const snap=S.synced[ME]||(S.synced[ME]={p:null,d:{}});const mine=S.logs[ME]||{};
  const ups=[],nts=[],dels=[],js={};
  const force=!snap.sv; // once after v1.0: resend every day so each carries its sangha summary
  for(const k in mine){const l=norm(mine[k]),j=JSON.stringify(l);if(force||snap.d[k]!==j){const {note,...data}=l;ups.push({user_id:ME,day:k,data,summary:summaryOf(atK(l,k),ME),updated_at:new Date().toISOString()});nts.push({user_id:ME,day:k,text:note||'',updated_at:new Date().toISOString()});js[k]=j}}
  for(const k in snap.d) if(!mine[k]) dels.push(k);
  const pf=pfOf(S.people[ME]),pj=JSON.stringify(pf);
  try{
    for(let i=0;i<ups.length;i+=200){const r=await sb.from('logs').upsert(ups.slice(i,i+200),{onConflict:'user_id,day'});if(r.error)throw r.error;
      const r2=await sb.from('notes').upsert(nts.slice(i,i+200),{onConflict:'user_id,day'});if(r2.error)throw r2.error}
    if(dels.length){const r=await sb.from('logs').delete().eq('user_id',ME).in('day',dels);if(r.error)throw r.error;await sb.from('notes').delete().eq('user_id',ME).in('day',dels)}
    if(snap.p!==pj){const r=await sb.from('profiles').update({...pf,updated_at:new Date().toISOString()}).eq('id',ME);if(r.error)throw r.error}
    Object.assign(snap.d,js);dels.forEach(k=>delete snap.d[k]);snap.p=pj;snap.sv=1;syncState='ok';lastSync=Date.now();
  }catch(e){syncState=navigator.onLine===false?'offline':'error';console.warn('sync',e)}

async function hashPw(pw){
  const txt='samyama:'+pw;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

}

function simFill(){
  const sd=V.sd,tk=todayK(),start=sd.range==='all'?addD(DAY1,-14):addD(tk,-(+sd.range)+1);
  const total=Math.max(1,diff(start,tk)+1),r=Math.random,ch=(p)=>r()<p,rnd=(a,b)=>Math.round(a+r()*(b-a));
  let k=start,i=0,made=0;S.logs[SANDBOX()]=S.logs[SANDBOX()]||{};
  while(k<=tk){
    const prog=i/Math.max(1,total-1);
    let q={steady:.85,improving:.3+.65*prog,mixed:.35+.55*r(),struggling:.38}[sd.pattern];
    q=Math.max(.05,Math.min(.98,q+(r()-.5)*.12));
    if(sd.gaps&&ch(.12)&&k!==tk){delete S.logs[SANDBOX()][k]}
    else{
      const l=norm({});
      l.bhuta=ch(q);l.sk=ch(q)?rnd(2,4):0;l.ss=ch(q)?rnd(10,18):0;l.asCyc=ch(q*.9)?rnd(6,16):0;l.asSec=[30,45,60,90][rnd(0,3)];
      l.sck=ch(q)?(ch(q)?2:1):(ch(.5)?1:0);l.shoonya=ch(q)?(ch(q*.95)?2:1):0;l.shambhavi=ch(q)?(ch(q)?2:1):0;
      l.sits=ch(q)?(ch(q)?[rnd(55,75)]:[rnd(25,45),rnd(10,25)]):(ch(.5)?[rnd(10,30)]:[]);
      l.aum=ch(q*.8)?rnd(5,25):0;l.ardha=Math.max(0,Math.round(15+prog*55*(.6+q*.4)+rnd(-6,6)));
      l.patanga=ch(q);l.shishu=ch(q*.9);
      l.dNeg=ch(q+.1);l.dStim=ch(q+.15);l.dNonveg=ch(q+.3);l.dDairy=ch(q);l.dOut=ch(q+.05);l.sattvic=ch(q);l.sn=0;l.v1=1;
      l.nat=Math.max(0,Math.min(100,Math.round((q*65+rnd(-10,15))/5)*5));
      l.sprouts=ch(q);l.peanuts=ch(q*.8);l.sanj=ch(q*.7);
      l.digital=Math.max(15,Math.round(220-150*q+rnd(-20,30)));l.silence=Math.round(q*4*2)/2;
      if(ch(.15))l.note=['Steady sitting today.','Mind was restless in Shoonya.','Long Sukha Kriya at sunset.','Felt light after the kanji.'][rnd(0,3)];
      S.logs[SANDBOX()][k]=l;made++;
    }
    k=addD(k,1);i++;
  }
  save();return made;
}

    if(a==='qtog'){l.qd[k]=!l.qd[k];if(l.qd[k])V.just=k;else delete l.qd[k]}
    if(a==='ctog'){l.cust[k]=!l.cust[k];if(l.cust[k])V.just='c-'+k}
    if(a==='ccyc'){const m=+b.dataset.max;l.cust[k]=((l.cust[k]||0)+1)%(m+1);if(l.cust[k])V.just='c-'+k}
    if(a==='inc'){const v=Math.round(((getV(l,k)??0)+ +b.dataset.d)*10)/10;setV(l,k,Math.max(0,Math.min(+b.dataset.max,v)));if(k==='scrPhone'||k==='scrTv'){l.digital=l.scrPhone+l.scrTv;if(document.getElementById('r-scard')&&!l.scrDone){save();const o=document.getElementById(oid(k)),t=document.getElementById('scrtot');if(o)o.textContent=dur(l[k]);if(t)t.textContent=dur(l.digital);return}l.scrDone=true}}
    if(a==='cyc'){const m=+b.dataset.max;l[k]=(l[k]+1)%(m+1);if(l[k])V.just=k}
    if(a==='sho'){const i=+b.dataset.i;l.shoonya=l.shoonya>i?i:i+1;if(l.shoonya)V.just='shoonya'}
    if(a==='tog') l[k]=!l[k];
    if(a==='set') l[k]=+b.dataset.v;
    if(a==='sadd') l.sits.push(l.sits.length?20:60);
    if(a==='sdel') l.sits.splice(+b.dataset.i,1);
    save();render();return;
  }
  const r=ME&&S.people[ME].routines[V.kind];
  if(a==='addbusy'){r.busy.push({l:'',s:780,e:840});save();render();return}
  if(a==='delbusy'){r.busy.splice(+b.dataset.i,1);save();render();return}
  if(a==='build'){buildPlan(ME,V.kind);V.et=null;render();return}
  if(a==='copy'){const t=JSON.stringify(S),m=$('#copymsg');
    const fallback=()=>{if(m)m.textContent='Copy is blocked here. Select the text below.';b.insertAdjacentHTML('afterend',`<div style="padding:0 14px 14px"><textarea readonly>${esc(t)}</textarea></div>`)};
    try{navigator.clipboard.writeText(t).then(()=>{if(m)m.textContent='Copied. Paste it somewhere safe.'},fallback)}catch(err){fallback()}
    return}
  if(a==='reset'){V.confirmReset=true;render();return}
  if(a==='reset0'){V.confirmReset=false;render();return}
  if(a==='reset1'&&CLOUD){(async()=>{V.confirmReset=false;S.logs[ME]={};save();await pushNow();render()})();return}
  if(a==='reset1'){S=fresh();save();ls.del(STORE+'-me');ls.del(STORE+'-adminok');ADMIN_TODAY=null;ME=null;V.confirmReset=false;V.ob='welcome';V.tab='today';V.sub=null;render();return}
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;
  if(f==='rng'){const l=mut(ME,V.day),k=t.dataset.k,v=+t.value;setV(l,k,v);save();t.style.setProperty('--p',(v/+t.max*100)+'%');const o=document.getElementById(oid(k));if(o)o.textContent=showV(k,v);return}
  if(f==='sim'){const start=addD(DAY1,-14),total=+t.max,idx=+t.value;V.sim=addD(start,idx);applyJourney();t.style.setProperty('--p',(idx/total*100)+'%');const d=$('#simday'),c=$('#simcur');if(d)d.textContent=dayLabel(V.sim);if(c)c.style.left=(idx/total*100)+'%';return}
  if(f==='dsl'){setDur(t.dataset.k,+t.value,'s');t.style.setProperty('--p',(+t.value/180*100)+'%');const k=t.dataset.k,v=+t.value,h=$('#dh-'+k),m=$('#dm-'+k);if(h)h.value=Math.floor(v/60);if(m)m.value=v%60;return}
  if(f==='dh'||f==='dm'){const k=t.dataset.k,h=+($('#dh-'+k).value||0),m=+($('#dm-'+k).value||0);if(h*60+m>0)setDur(k,h*60+m,f==='dh'?'h':'m');return}
  if(f==='note'){mut(ME,V.day).note=t.value;save()}
  if(f==='name'){S.people[t.dataset.p].name=t.value||'—';save()}
  if(f==='obname'){V.obName=t.value}
  if(f==='obpw1'){V.obPw1=t.value}
  if(f==='obpw2'){V.obPw2=t.value}
  if(f==='obemail'){V.obEmail=t.value}
  if(f==='cfname'&&V.cf){V.cf.name=t.value}
  if(f==='cfunit'&&V.cf){V.cf.unit=t.value}
  if(f==='cftarget'&&V.cf){V.cf.target=+t.value}
  if(f==='cfd'&&V.cf){V.cf.d=+t.value}
});
// time fields save on change but redraw only after the field is left, so the phone's picker never closes mid-selection
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f;if(!f||f==='note'||f==='obname'||f==='obpw1'||f==='obpw2'||f==='obemail'||/^cf/.test(f))return;
  if(f==='name'){renderHeader();return}
  if(f==='rng'||f==='sim'){render();return}
  if(f==='adate'){if(!t.value)return;ADMIN_TODAY=t.value===keyOf(new Date())?null:t.value;S.adminToday=ADMIN_TODAY;save();V.day=todayK();render();return}
  if(f==='dsl'||f==='dh'||f==='dm'){rebuildPlans();return}
  if(f==='photo'){const file=t.files&&t.files[0];if(!file)return;const msg=$('#photomsg');if(msg)msg.textContent='Preparing photo…';loadPhoto(file,url=>{if(!url){if(msg)msg.textContent='That file could not be read as an image. Try a JPG or PNG.';return}S.people[ME].photo=url;save();render()});return}
  if(!t.value&&t.type==='time')return;
  if(f==='remfrom'){remOf(ME).ardha.from=fromHM(t.value);remChanged();return}
  if(f==='remto'){remOf(ME).ardha.to=fromHM(t.value);remChanged();return}
  if(f==='remat'){remOf(ME).screen.at=fromHM(t.value);remChanged();return}
  if(f==='obwake'){V.obWake=fromHM(t.value);return}
  if(f==='obsleep'){V.obSleep=fromHM(t.value)||1439;return}
  const P=S.people[ME],r=P.routines[V.kind],i=+t.dataset.i;
  if(f==='wake') r.wake=fromHM(t.value);
  if(f==='sleep') r.sleep=fromHM(t.value)||1439;
  if(f==='bl') r.busy[i].l=t.value;
  if(f==='bs') r.busy[i].s=fromHM(t.value);
  if(f==='be') r.busy[i].e=fromHM(t.value);
  if(f==='pt'){r.plan[i].s=fromHM(t.value);save();return} // redrawn when Done is tapped
  save();V.dirty=true;
});
document.addEventListener('focusout',()=>{
  if(!V.dirty)return;
  setTimeout(()=>{const a=document.activeElement;if(a&&a.matches('input:not([type=range]),textarea'))return;V.dirty=false;render()},250);
});
let sw=null;
document.addEventListener('touchstart',e=>{const h=e.target.closest('.hero');sw=h?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
  if(Math.abs(dx)>50&&Math.abs(dy)<40){const n=addD(V.day,dx<0?1:-1);if(n<=todayK()){V.day=n;V.open=null;render()}}},{passive:true});
setInterval(()=>{const a=document.activeElement;if(!V.ob&&V.tab==='today'&&!(a&&a.matches('input,textarea')))render()},120000);
if(CLOUD_CFG&&!CLOUD){document.getElementById('main').innerHTML='<div class="ob" style="justify-content:center;text-align:center"><h2>Can’t connect right now</h2><p>The app needs the internet the first time it opens. Check your connection and try again.</p><button class="btn big" onclick="location.reload()">Try again</button></div>';document.getElementById('tabs').hidden=true}
else if(CLOUD){render();bootCloud()}else render();
</script>
